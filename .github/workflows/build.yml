name: build installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bundles:
        description: "逗号分隔的 bundle 类型，留空则用平台默认值"
        required: false
        default: ""

permissions:
  contents: write

env:
  # Keep the three platforms honest about what they produced.
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            artifacts: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
          # macos-latest runners are Apple Silicon, so the binary is arm64.
          - os: macos-latest
            bundles: dmg,app
            artifacts: |
              target/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            bundles: deb,appimage
            artifacts: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage

    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget \
            file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Show the build architecture
        shell: bash
        run: |
          echo "runner arch: $(uname -m)"

      - name: Resolve bundles
        id: bundles
        shell: bash
        run: |
          requested="${{ github.event.inputs.bundles }}"
          echo "value=${requested:-${{ matrix.bundles }}}" >> "$GITHUB_OUTPUT"

      - name: Build installers
        run: npx tauri build --bundles ${{ steps.bundles.outputs.value }}

      - name: Show what was built
        shell: bash
        run: |
          find target/release/bundle -type f \( -name '*.dmg' -o -name '*.exe' \
            -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' \) -print
          file target/release/llm-lite-proxy 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifacts }}
