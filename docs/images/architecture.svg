<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1120" height="470" fill="#ffffff"/>

  <text x="40" y="34" font-size="17" font-weight="600" fill="#0f172a">转换拓扑：内部只有 Chat Completions 一种表示</text>
  <text x="40" y="56" font-size="12.5" fill="#64748b">每个 API 面只维护一条到内部表示的桥，所以任意入站面都能接任意上游面。</text>

  <!-- client column -->
  <text x="40" y="96" font-size="12" font-weight="600" fill="#64748b" letter-spacing="0.6">客户端侧（入站）</text>
  <g stroke="#94a3b8" stroke-width="1.2" fill="#f8fafc">
    <rect x="40" y="108" width="250" height="52" rx="8"/>
    <rect x="40" y="180" width="250" height="52" rx="8"/>
    <rect x="40" y="252" width="250" height="52" rx="8"/>
  </g>
  <g font-size="13.5" fill="#0f172a">
    <text x="56" y="131">/v1/chat/completions</text>
    <text x="56" y="150" font-size="11.5" fill="#64748b">OpenAI Chat Completions</text>
    <text x="56" y="203">/v1/responses</text>
    <text x="56" y="222" font-size="11.5" fill="#64748b">OpenAI Responses</text>
    <text x="56" y="275">/v1/messages</text>
    <text x="56" y="294" font-size="11.5" fill="#64748b">Anthropic Messages</text>
  </g>

  <!-- proxy box -->
  <rect x="380" y="108" width="360" height="196" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="400" y="134" font-size="14.5" font-weight="600" fill="#2563eb">LLM Lite Proxy</text>
  <rect x="400" y="148" width="320" height="42" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="416" y="168" font-size="13" font-weight="600" fill="#0f172a">唯一内部表示：Chat Completions</text>
  <text x="416" y="183" font-size="11.5" fill="#64748b">请求 · 非流式响应 · SSE 流式逐块转换</text>
  <g font-size="12" fill="#334155">
    <text x="400" y="216">工具调用三向转换，非法工具名清洗后在响应端还原</text>
    <text x="400" y="236">思考块 thinking / reasoning_content 双向映射</text>
    <text x="400" y="256">usage 三个桶按各家口径拆分，不重复相加</text>
    <text x="400" y="276" fill="#64748b">同面直通：只改写模型名，客户端原生参数原样保留</text>
  </g>

  <!-- upstream column -->
  <text x="820" y="96" font-size="12" font-weight="600" fill="#64748b" letter-spacing="0.6">上游侧（出站）</text>
  <g stroke="#94a3b8" stroke-width="1.2" fill="#f8fafc">
    <rect x="820" y="108" width="260" height="62" rx="8"/>
    <rect x="820" y="200" width="260" height="62" rx="8"/>
  </g>
  <g font-size="13.5" fill="#0f172a">
    <text x="836" y="131">OpenAI 兼容上游</text>
    <text x="836" y="150" font-size="11.5" fill="#64748b">protocol = openai</text>
    <text x="836" y="164" font-size="11.5" fill="#64748b">api = chat | responses</text>
    <text x="836" y="223">Anthropic 兼容上游</text>
    <text x="836" y="242" font-size="11.5" fill="#64748b">protocol = anthropic</text>
    <text x="836" y="256" font-size="11.5" fill="#64748b">api = messages</text>
  </g>

  <!-- connectors -->
  <g stroke="#64748b" stroke-width="1.4" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <path d="M 290 134 L 380 160"/>
    <path d="M 290 206 L 380 206"/>
    <path d="M 290 278 L 380 252"/>
    <path d="M 740 150 L 820 139"/>
    <path d="M 740 240 L 820 231"/>
  </g>

  <!-- routing note -->
  <rect x="40" y="330" width="1040" height="96" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="356" font-size="13" font-weight="600" fill="#0f172a">选路顺序</text>
  <text x="60" y="378" font-size="12.5" fill="#334155">1 精确别名 public → upstream　　2 provider/model 前缀直接指定上游　　3 patterns 里的 glob 按顺序匹配　　4 server.default_provider 兜底</text>
  <text x="60" y="404" font-size="12.5" fill="#64748b">鉴权：Authorization: Bearer 与 x-api-key 都认，密钥取自 server.master_keys；上游密钥留空时把客户端密钥原样转发过去（纯协议壳用法）。</text>
</svg>
