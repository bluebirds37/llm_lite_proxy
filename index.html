<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Lite Proxy</title>
    <script>
      // Set before the first paint so a dark start never flashes light.
      try {
        const stored = localStorage.getItem("llp-theme");
        const wantsLight =
          stored === "light" ||
          (!stored && window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = wantsLight ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
      // macOS draws the traffic lights over the webview (overlay title bar),
      // so the header has to keep its first 88px clear.
      if (navigator.userAgent.includes("Macintosh")) {
        document.documentElement.dataset.os = "mac";
      }
    </script>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="root">
      <header class="bar">
        <div class="brand">
          <span class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 8h13l-3.5-3.5M21 16H8l3.5 3.5" />
            </svg>
          </span>
          <div>
            <h1>LLM Lite Proxy</h1>
            <p class="sub">OpenAI ⇄ Anthropic 协议转换代理</p>
          </div>
        </div>
        <div class="status">
          <span id="pill" class="pill off">已停止</span>
          <code id="address" class="addr" title="点击复制 base URL">–</code>
          <button id="copy-url" class="ghost" type="button">复制地址</button>
          <button id="toggle-run" class="primary" type="button">启动</button>
          <span id="dirty" class="chip hidden">有未保存的改动</span>
          <button id="save" class="accent" type="button">保存配置</button>
          <button
            id="theme-toggle"
            type="button"
            class="icon-btn"
            title="切换浅色 / 深色主题"
            aria-label="切换主题"
          >
            <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <circle cx="12" cy="12" r="4.2" />
              <path d="M12 2.6v2.2M12 19.2v2.2M4.2 12H2M22 12h-2.2M5.6 5.6 7.2 7.2M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6" />
            </svg>
            <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.8 6.8 0 0 0 9.7 9.7z" />
            </svg>
          </button>
        </div>
      </header>

      <div id="banner" class="banner hidden"></div>

      <section class="metrics">
        <div><span id="m-requests">0</span><label>请求</label></div>
        <div><span id="m-active">0</span><label>进行中</label></div>
        <div><span id="m-errors" class="bad">0</span><label>失败</label></div>
        <div><span id="m-in">0</span><label>输入 tokens</label></div>
        <div><span id="m-out">0</span><label>输出 tokens</label></div>
        <div><span id="m-uptime">0s</span><label>运行时长</label></div>
      </section>

      <nav class="tabs" id="tabs">
        <button class="tab active" data-panel="providers" type="button">上游配置</button>
        <button class="tab" data-panel="server" type="button">代理设置</button>
        <button class="tab" data-panel="logs" type="button">请求日志</button>
        <button class="tab" data-panel="start" type="button">客户端接入</button>
      </nav>

      <main>
        <section id="panel-providers" class="panel active"></section>
        <section id="panel-server" class="panel"></section>
        <section id="panel-logs" class="panel"></section>
        <section id="panel-start" class="panel"></section>
      </main>

      <footer class="foot">
        <span id="config-path"></span>
        <span id="saved" class="hidden">已保存并生效</span>
      </footer>

      <div id="toast" class="toast hidden" role="status"></div>
    </div>
  </body>
</html>
